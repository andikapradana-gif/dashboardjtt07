<script>
function loadTopLow() {
  const key = `toplow_${STATE.mode}_${STATE.metric}_${STATE.segment}_${STATE.hub}_${STATE.date}_${STATE.week}_${STATE.month}`;
  callApiCached(key, 'apiGetTopLow',
    [STATE.mode, STATE.metric, 10, 10, STATE.segment, STATE.hub, STATE.date, STATE.week, STATE.month],
    'toplow', renderTopLow);
}

function renderTopLow(data) {
  if (!data.top || !data.top.length) return showEmpty();
  const rl = (l, t) => l.map((it, i) => `<div style="display:flex; justify-content:space-between; padding:8px 0; border-bottom:1px solid var(--border)"><div><span class="muted">${i+1}.</span> <b>${esc(it.hub)}</b></div><span style="font-weight:700; color:${t?'var(--ok-text)':'var(--crit-text)'}">${it.value.toFixed(2)}%</span></div>`).join('');
  const lowHtml = data.low && data.low.length > 0 ? rl(data.low, false) : '<div class="muted" style="text-align:center; padding:20px 0; display:flex; align-items:center; justify-content:center; gap:6px;"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="color:var(--ok-text);"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/></svg> Semua Aman (>= ' + TARGET_THRESHOLD.toFixed(2) + '%)</div>';
  document.getElementById('pageContent').innerHTML = `
    <div style="display:grid; grid-template-columns:repeat(auto-fit,minmax(280px,1fr)); gap:20px">
      <div class="card">
        <h3 style="display:flex; align-items:center; gap:8px; margin-bottom:12px;">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="color:#eab308;"><path d="M6 9H4.5a2.5 2.5 0 0 1 0-5H6"/><path d="M18 9h1.5a2.5 2.5 0 0 0 0-5H18"/><path d="M4 22h16"/><path d="M10 14.66V17c0 .55-.47.98-.97 1.21C7.85 18.75 7 20.24 7 22"/><path d="M14 14.66V17c0 .55.47.98.97 1.21C16.15 18.75 17 20.24 17 22"/><path d="M18 2H6v7a6 6 0 0 0 12 0V2z"/></svg> Terbaik
        </h3>
        ${rl(data.top, true)}
      </div>
      <div class="card">
        <h3 style="display:flex; align-items:center; gap:8px; margin-bottom:12px;">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="color:var(--crit-text);"><path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg> Terendah (&lt; ${TARGET_THRESHOLD.toFixed(2)}%)
        </h3>
        ${lowHtml}
      </div>
    </div>`;
  setUpdated();
}
</script>
