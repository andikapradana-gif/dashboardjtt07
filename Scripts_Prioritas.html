<script>
function loadBottomPrioritas() {
  const key = `bp_${STATE.mode}_${STATE.bottomSource}_${STATE.hub}_${STATE.date}_${STATE.week}_${STATE.month}`;
  const apiFn = (STATE.bottomSource === 'weekly' || STATE.mode === 'LM') ? 'apiGetWeekly' : 'apiGetMonthly';
  callApiCached(key, apiFn, [STATE.mode, STATE.hub, STATE.week, STATE.month],
    'bottomprioritas', data => renderBottomPrioritas(data, STATE.bottomView));
}

function renderBottomPrioritas(data, viewMode) {
  if (!data.rows || !data.rows.length) return showEmpty();
  
  const isWeekly = STATE.bottomSource === 'weekly' || STATE.mode === 'LM';
  const sourceLabel = isWeekly ? 'Data Mingguan' : 'Data Bulanan';
  const metrics = METRICS_MAP[STATE.mode] || METRICS_MAP.FM;
  
  const allDeficits = [];
  data.rows.forEach(r => {
    metrics.forEach(m => {
      const v = parsePct(r[m.label]);
      if (v !== null && v < TARGET_THRESHOLD) {
        allDeficits.push({ hub: r.Hub, group: isWeekly ? r.Week : r.Month, metricKey: m.key, metricLabel: m.label, value: v, gap: TARGET_THRESHOLD - v });
      }
    });
  });

  const weeklySelectLabel = pageLabel('weekly');

  let html = `
    <div class="card" style="margin-bottom:16px; display:flex; flex-wrap:wrap; gap:16px; align-items:center; justify-content:space-between">
      <div>
        <h3 style="margin-bottom:4px; font-size:16px; display:flex; align-items:center; gap:8px;">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="color:var(--crit-text);"><path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg> Prioritas Perbaikan
        </h3>
        <div class="subtitle">Sumber data: <b>${sourceLabel}</b></div>
      </div>
      <div style="display:flex; gap:8px; align-items:center; flex-wrap:wrap">
        ${STATE.mode === 'FM' ? `
        <label class="filter-label-sm">Sumber Data
          <select id="bpSource" class="select" onchange="changeBPSource(this.value)">
            <option value="weekly" ${isWeekly ? 'selected' : ''}>${weeklySelectLabel}</option>
            <option value="monthly" ${!isWeekly ? 'selected' : ''}>${pageLabel('monthly')}</option>
          </select>
        </label>` : ''}
        <label class="filter-label-sm">Tampilan
          <select id="bpView" class="select" onchange="changeBPView(this.value)">
            <option value="metric" ${viewMode === 'metric' ? 'selected' : ''}>By Metrik</option>
            <option value="score" ${viewMode === 'score' ? 'selected' : ''}>By Score</option>
          </select>
        </label>
      </div>
    </div>
  `;

  if (allDeficits.length === 0) {
    html += `
      <div class="empty-box" style="background:var(--ok-bg); color:var(--ok-text); border-color:#86efac; display:flex; flex-direction:column; align-items:center; gap:8px;">
        <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/></svg>
        <div style="font-weight:700">Luar Biasa!</div>
        <div>Tidak ada hub yang berada di bawah ${TARGET_THRESHOLD.toFixed(2)}%.</div>
      </div>`;
  } else if (viewMode === 'metric') {
    html += `<div style="display:grid; grid-template-columns:repeat(auto-fit, minmax(280px, 1fr)); gap:16px">`;
    metrics.forEach(m => {
      const items = allDeficits.filter(d => d.metricKey === m.key).sort((a,b) => a.value - b.value);
      html += `
        <div class="card" style="padding:0; overflow:hidden; display:flex; flex-direction:column">
          <div style="padding:12px 16px; background:var(--bg); border-bottom:1px solid var(--border); display:flex; justify-content:space-between; align-items:center">
            <b style="color:var(--text-main)">${esc(m.label)}</b>
            <span class="badge ${items.length > 0 ? 'kritis' : 'tercapai'}">${items.length} isu</span>
          </div>
          <div style="padding:8px 16px; flex:1">
            ${items.length === 0 ? '<div style="padding:16px 0; text-align:center; color:var(--ok-text); font-size:12px; display:flex; align-items:center; justify-content:center; gap:6px;"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 6L9 17l-5-5"/></svg> Semua Hub Lolos</div>' : ''}
            ${items.map((it) => `
              <div style="display:flex; justify-content:space-between; align-items:center; padding:8px 0; border-bottom:1px dashed var(--border); font-size:13px">
                <div><div style="font-weight:600">${esc(it.hub)}</div><div class="subtitle">${isWeekly ? 'W: ' + it.group : 'M: ' + formatMonthLabel(it.group)}</div></div>
                <div style="text-align:right"><div style="font-weight:800; color:var(--crit-text)">${it.value.toFixed(2)}%</div><div class="subtitle" style="font-size:10px">Gap: -${it.gap.toFixed(2)}%</div></div>
              </div>
            `).join('')}
          </div>
        </div>`;
    });
    html += `</div>`;
  } else {
    allDeficits.sort((a, b) => a.value - b.value);
    html += `
      <div class="heatmap-wrap">
        <table class="heatmap-table">
          <thead><tr><th style="width:50px">#</th><th>Hub</th><th>Periode</th><th>Metrik</th><th style="text-align:right">Skor</th><th style="text-align:right">Gap</th></tr></thead>
          <tbody>
            ${allDeficits.map((it, i) => `
              <tr>
                <td class="muted" style="font-weight:700">${i + 1}</td>
                <td><b>${esc(it.hub)}</b></td>
                <td class="subtitle">${isWeekly ? it.group : formatMonthLabel(it.group)}</td>
                <td>${esc(it.metricLabel)}</td>
                <td class="cell fail" style="text-align:right; font-weight:800">${it.value.toFixed(2)}%</td>
                <td style="text-align:right; color:var(--crit-text); font-weight:600">-${it.gap.toFixed(2)}%</td>
              </tr>
            `).join('')}
          </tbody>
        </table>
      </div>`;
  }
  document.getElementById('pageContent').innerHTML = html;
  setUpdated();
}

function changeBPSource(val) { STATE.bottomSource = val; renderPage(); }
function changeBPView(val) { STATE.bottomView = val; renderPage(); }
</script>
