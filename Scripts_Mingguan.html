<script>
/* Gaya kolom sticky disisipkan sekali saja ke <head> (bukan di setiap render) */
function ensureWmStyle_() {
  if (document.getElementById('wmStickyStyle')) return;
  const s = document.createElement('style'); s.id = 'wmStickyStyle';
  s.textContent = '.sticky-col-1 { position: sticky; left: 0; background: var(--card-solid, #fff); z-index: 5; border-right: 1px solid var(--border); }' +
    '.sticky-col-2 { position: sticky; left: 130px; background: var(--card-solid, #fff); z-index: 5; border-right: 2px solid var(--border); }' +
    'th.sticky-col-1, th.sticky-col-2 { z-index: 12; background: var(--card-solid, #fff); }';
  document.head.appendChild(s);
}

function loadWeekly() {
  const key = `weekly_${STATE.mode}_${STATE.hub}_${STATE.week}_${STATE.month}`;
  callApiCached(key, 'apiGetWeekly', [STATE.mode, STATE.hub, STATE.week, STATE.month], 'weekly', renderWeekly);
}

/* Tampilan nilai per metrik: 'ach' = Achievement (%), 'score' = Score (poin). Tetap dipilih saat filter / mode berganti. */
let WEEKLY_VIEW = 'ach';
let WEEKLY_LAST = null;

function setWeeklyView(v) {
  WEEKLY_VIEW = (v === 'score') ? 'score' : 'ach';
  if (WEEKLY_LAST) renderWeekly(WEEKLY_LAST);   // hanya render ulang, tanpa panggilan server
}

function renderWeekly(data) {
  if (!data.rows || !data.rows.length) return showEmpty('Data weekly tidak ditemukan.');

  WEEKLY_LAST = data;
  ensureWmStyle_();
  const metrics = METRICS_MAP[STATE.mode] || METRICS_MAP.FM;
  const hasScores = !!data.hasScores;
  const view = (hasScores && WEEKLY_VIEW === 'score') ? 'score' : 'ach';

  const toggle = hasScores ? `
    <div style="display:flex; align-items:center; gap:10px; flex-wrap:wrap; margin:0 0 10px;">
      <span class="select-label" style="margin:0;">Tampilan nilai</span>
      <div class="seg" role="group" aria-label="Tampilan nilai per metrik">
        <button type="button" class="${view === 'ach' ? 'active' : ''}" aria-pressed="${view === 'ach'}" onclick="setWeeklyView('ach')">Achievement</button>
        <button type="button" class="${view === 'score' ? 'active' : ''}" aria-pressed="${view === 'score'}" onclick="setWeeklyView('score')">Score</button>
      </div>
      <span style="font-size:12px; color:var(--text-muted);">${view === 'ach' ? 'Persen pencapaian per metrik' : 'Poin per metrik (jumlahnya = Score). Warna tetap mengikuti achievement'}</span>
    </div>` : '';

  /* Sel metrik: nilai sesuai tampilan, warna selalu dari achievement */
  const cellHtml = (r, m) => {
    const ach = r[m.label];
    const shown = view === 'score' ? ((r.ScoreByMetric && r.ScoreByMetric[m.label]) || '—') : ach;
    return `<td class="cell ${wmCellClass(ach)}">${esc(shown)}</td>`;
  };

  let html = toggle + `
    <div class="heatmap-wrap">
      <table class="heatmap-table table-fit" id="fullTable">
        <thead>
          <tr>
            <th class="sticky-col-1" style="min-width: 130px;">Hub</th>
            <th class="sticky-col-2" style="min-width: 90px; text-align: center;">Score</th>
            <th style="text-align: center;">Week</th>
            <th style="text-align: center;">Month</th>
            ${metrics.map(m => `<th style="text-align: center;">${esc(m.label)}</th>`).join('')}
          </tr>
        </thead>
        <tbody>
          ${data.rows.map(r => `
            <tr>
              <td class="sticky-col-1"><b>${esc(r.Hub)}</b></td>
              <td class="sticky-col-2" style="color: var(--primary); font-weight: 800; text-align: center;">${esc(r.Score)}</td>
              <td style="text-align: center;">${esc(r.Week)}</td>
              <td style="text-align: center;">${esc(formatMonthLabel(r.Month))}</td>
              ${metrics.map(m => cellHtml(r, m)).join('')}
            </tr>
          `).join('')}
        </tbody>
      </table>
    </div>
  `;
  document.getElementById('pageContent').innerHTML = html;
  setUpdated();
}

function loadMonthly() {
  const key = `monthly_${STATE.mode}_${STATE.hub}_${STATE.month}`;
  callApiCached(key, 'apiGetMonthly', [STATE.mode, STATE.hub, STATE.month], 'monthly', renderMonthly);
}

function renderMonthly(data) {
  if (!data.rows || !data.rows.length) return showEmpty('Data monthly tidak ditemukan.');

  ensureWmStyle_();
  const metrics = METRICS_MAP[STATE.mode] || METRICS_MAP.FM;

  let html = `
    <div class="heatmap-wrap">
      <table class="heatmap-table table-fit" id="fullTable">
        <thead>
          <tr>
            <th class="sticky-col-1" style="min-width: 130px;">Hub</th>
            <th class="sticky-col-2" style="min-width: 90px; text-align: center;">Score</th>
            <th style="text-align: center;">Month</th>
            ${metrics.map(m => `<th style="text-align: center;">${esc(m.label)}</th>`).join('')}
          </tr>
        </thead>
        <tbody>
          ${data.rows.map(r => `
            <tr>
              <td class="sticky-col-1"><b>${esc(r.Hub)}</b></td>
              <td class="sticky-col-2" style="color: var(--primary); font-weight: 800; text-align: center;">${esc(r.Score)}</td>
              <td style="text-align: center;">${esc(formatMonthLabel(r.Month))}</td>
              ${metrics.map(m => `<td class="cell ${wmCellClass(r[m.label])}">${esc(r[m.label])}</td>`).join('')}
            </tr>
          `).join('')}
        </tbody>
      </table>
    </div>
  `;
  document.getElementById('pageContent').innerHTML = html;
  setUpdated();
}
</script>
